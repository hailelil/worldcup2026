name: Refresh World Cup data

# Fetches football-data.org with the repo's secret key and force-pushes the
# raw JSON to a single-commit orphan `data` branch. App clients read it from
# raw.githubusercontent.com -- the API key never reaches users, and total API
# usage stays at 3 requests per run regardless of how many users the app has.
#
# Setup: repo Settings -> Secrets and variables -> Actions -> New repository
# secret, name FOOTBALL_DATA_API_KEY.

on:
  schedule:
    - cron: '*/5 * * * *' # GitHub may delay this to ~10 min; fine for scores
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check tournament window
        id: window
        run: |
          # Final is July 19, 2026; stop refreshing a week after.
          if [ "$(date -u +%Y%m%d)" -gt 20260726 ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Tournament over -- skipping (disable this workflow)."
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch from football-data.org
        if: steps.window.outputs.active == 'true'
        env:
          KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p out
          base="https://api.football-data.org/v4/competitions/WC"
          curl -fsS --retry 2 -H "X-Auth-Token: $KEY" "$base/matches"   -o out/matches.json
          sleep 7 # free tier: 10 requests/minute
          curl -fsS --retry 2 -H "X-Auth-Token: $KEY" "$base/standings" -o out/standings.json
          sleep 7
          curl -fsS --retry 2 -H "X-Auth-Token: $KEY" "$base/teams"     -o out/teams.json
          # Validate payloads before publishing (fails fast on empty/malformed JSON).
          jq -e '.matches | length > 0' out/matches.json > /dev/null
          jq -e '.standings | length > 0' out/standings.json > /dev/null
          jq -e '.teams | length > 0' out/teams.json > /dev/null

      - name: Publish to the data branch
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd out
          git init -q -b data
          git config user.name "wc-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -qm "data refresh"
          # Single-commit orphan branch: force-push keeps history at size 1.
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" data
